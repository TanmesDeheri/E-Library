name: Build and Deploy to SmarterASP.NET

on:
  push:
    branches: [ Feature ]

jobs:
  build-and-deploy:
    runs-on: windows-latest # Required to build .NET Framework apps using MSBuild

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Setup MSBuild
      uses: microsoft/setup-msbuild@v2

    - name: Restore NuGet Packages
      run: nuget restore ELibrary.sln # Replace with your actual .sln file name

    - name: Build and Publish Project
      run: msbuild ELibrary.sln /p:Configuration=Release /p:DeployOnBuild=True /p:PublishProfile=FolderProfile # Or build directly to a output folder
      
    # Alternative standard dotnet/msbuild publish command to target a folder:
    - name: Publish to folder
      run: msbuild ELibrary.csproj /p:Configuration=Release /p:DeployOnBuild=true /p:PublishProfileFolder="${{ github.workspace }}/publish"

    - name: Upload to SmarterASP.NET via FTP
      uses: SamKirkland/FTP-Deploy-Action@v4.3.4
      with:
        server: ${{ secrets.FTP_SERVER }}
        username: ${{ secrets.FTP_USERNAME }}
        password: ${{ secrets.FTP_PASSWORD }}
        local-dir: ./publish/ # Path where your compiled build output is saved
